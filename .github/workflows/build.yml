name: Button Key Floating Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;27.3.13750724"

      - name: Build ARMv7 library
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          "$ANDROID_NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=app/Android.mk \
            NDK_APPLICATION_MK=app/Application.mk \
            V=1

      - name: Show build output
        run: |
          echo "=== BUILD OUTPUT ==="
          find . -type f \( -name "*.so" -o -name "*.a" \) -print

      - name: Upload ARMv7 library
        uses: actions/upload-artifact@v4
        with:
          name: Button-Key-Floating-armeabi-v7a
          path: libs/armeabi-v7a/*.so
          "$NDK/ndk-build" --version

          echo "armeabi-v7a compiler:"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --target=armv7a-linux-androideabi21 \
            --version

          echo "ANDROID NDK TEST PASSED"
